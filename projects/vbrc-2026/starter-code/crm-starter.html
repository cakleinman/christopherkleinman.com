<!doctype html>

<!--
  ============================================================
  Rivera Grounds Co · Mini CRM — STARTER CODE
  ============================================================

  This is a single-file, self-contained version of the tool
  demoed at the 10th Annual Veteran-Owned Business Conference
  (May 2026) by Christopher Kleinman.

  Talk: "Making Internal Business Tools With AI"
  Site: https://christopherkleinman.com

  Use this file as a jumping-off point for your own tool.
  Feed it to your AI of choice (Claude, Cursor, Copilot,
  Gemini, ChatGPT, etc.) and ask it to adapt the patterns to
  your business — your customers, your fields, your workflow.

  Original source file: tools/crm.html
  Brand tokens (Rivera Grounds Co colors, type, components)
  are inlined from _shared.css in the <style> block below.
  Replace them with your own brand and you have a starting
  point that's already wired together.

  External libraries are loaded from jsDelivr — swap to your
  preferred CDN or vendor them locally for offline use.
  ============================================================
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Rivera Grounds Co — Customers</title>
<style>
/* ===== Inlined from _shared.css =====
   Brand tokens, components, and helpers from Rivera Grounds Co's
   shared stylesheet. Replace with your own brand. */
/* ============================================================
   Rivera Grounds Co — Shared Tool Styles
   ----------------------------------------------------------------
   Every demo tool in /tools/ pulls in this file. Defines brand
   tokens, header band, base typography, buttons, inputs, cards.
   Tools layer their own tool-local CSS on top.
   ============================================================ */

/* ---------- Brand tokens ---------- */
:root {
  --rg-green:        #4a7c4e;
  --rg-green-dk:     #2d4a30;
  --rg-green-pale:   #e3ede4;
  --rg-tan:          #d8c79a;
  --rg-tan-dk:       #b8a574;
  --rg-cream:        #f7f5f0;
  --rg-cream-dk:     #efeae0;
  --rg-ink:          #1f2a1f;
  --rg-ink-dim:      #5a6f5d;
  --rg-ink-faint:    #8a9b8c;
  --rg-line:         rgba(74, 124, 78, 0.18);
  --rg-line-strong:  rgba(74, 124, 78, 0.4);
  --rg-warning:      #b8742d;
  --rg-success:      #4a7c4e;

  --rg-radius:       8px;
  --rg-radius-lg:    14px;
  --rg-shadow-sm:    0 1px 2px rgba(31, 42, 31, 0.06), 0 1px 3px rgba(31, 42, 31, 0.04);
  --rg-shadow-md:    0 4px 12px rgba(31, 42, 31, 0.08), 0 2px 4px rgba(31, 42, 31, 0.04);
  --rg-shadow-lg:    0 16px 40px rgba(31, 42, 31, 0.12), 0 4px 12px rgba(31, 42, 31, 0.06);

  --rg-font-display: ui-serif, Georgia, "Times New Roman", serif;
  --rg-font-body:    -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --rg-font-mono:    ui-monospace, "SF Mono", Menlo, Monaco, "Cascadia Code", monospace;
}

/* ---------- Reset / base ---------- */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--rg-cream);
  color: var(--rg-ink);
  font-family: var(--rg-font-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background-image:
    radial-gradient(rgba(74, 124, 78, 0.06) 1px, transparent 1px);
  background-size: 24px 24px;
}

/* ---------- Page shell ---------- */
.rg-shell {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

/* ---------- Header band ---------- */
.rg-header {
  background: var(--rg-green-dk);
  color: var(--rg-cream);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 20px;
  border-bottom: 3px solid var(--rg-tan);
}
.rg-mark {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--rg-font-display);
  font-style: italic;
  font-weight: 400;
  font-size: 22px;
  letter-spacing: 0.01em;
  color: var(--rg-cream);
  text-decoration: none;
}
.rg-mark::before {
  content: "";
  display: inline-block;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--rg-tan);
  box-shadow: 0 0 0 3px rgba(216, 199, 154, 0.25);
}
.rg-mark .ampersand { color: var(--rg-tan); }
.rg-tagline {
  font-size: 11px;
  color: rgba(247, 245, 240, 0.65);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-left: auto;
}
.rg-tag-pill {
  margin-left: 18px;
  padding: 4px 10px;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--rg-tan);
  border: 1px solid rgba(216, 199, 154, 0.3);
  border-radius: 999px;
  font-weight: 600;
}

/* ---------- Page title strip ---------- */
.rg-title-strip {
  padding: 18px 28px;
  background: rgba(255, 255, 255, 0.6);
  border-bottom: 1px solid var(--rg-line);
  display: flex;
  align-items: center;
  gap: 16px;
}
.rg-title-strip h1 {
  margin: 0;
  font-family: var(--rg-font-display);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--rg-green-dk);
}
.rg-title-strip .rg-sub {
  font-size: 13px;
  color: var(--rg-ink-dim);
}

/* ---------- Buttons ---------- */
.rg-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 16px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  line-height: 1;
  border: 1px solid transparent;
  border-radius: var(--rg-radius);
  cursor: pointer;
  transition: transform 80ms ease, box-shadow 120ms ease, background 120ms ease;
  white-space: nowrap;
  letter-spacing: 0.01em;
}
.rg-btn:active { transform: translateY(1px); }
.rg-btn--primary {
  background: var(--rg-green-dk);
  color: var(--rg-cream);
}
.rg-btn--primary:hover {
  background: var(--rg-green);
  box-shadow: var(--rg-shadow-md);
}
.rg-btn--secondary {
  background: var(--rg-cream);
  color: var(--rg-green-dk);
  border-color: var(--rg-line-strong);
}
.rg-btn--secondary:hover {
  background: var(--rg-green-pale);
  border-color: var(--rg-green);
}
.rg-btn--ghost {
  background: transparent;
  color: var(--rg-ink-dim);
  border-color: transparent;
}
.rg-btn--ghost:hover {
  color: var(--rg-green-dk);
  background: rgba(74, 124, 78, 0.06);
}
.rg-btn--danger {
  background: transparent;
  color: var(--rg-warning);
  border-color: rgba(184, 116, 45, 0.3);
}
.rg-btn--danger:hover {
  background: rgba(184, 116, 45, 0.08);
}
.rg-btn--sm { padding: 6px 12px; font-size: 12px; }
.rg-btn--lg { padding: 12px 22px; font-size: 14px; }
.rg-btn--icon { padding: 8px; min-width: 32px; }

/* ---------- Inputs ---------- */
.rg-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.rg-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--rg-ink-dim);
}
.rg-input,
.rg-select,
.rg-textarea {
  font-family: inherit;
  font-size: 14px;
  color: var(--rg-ink);
  background: #fff;
  border: 1px solid var(--rg-line-strong);
  border-radius: var(--rg-radius);
  padding: 9px 12px;
  line-height: 1.4;
  transition: border-color 120ms, box-shadow 120ms;
  width: 100%;
}
.rg-textarea {
  resize: vertical;
  min-height: 72px;
}
.rg-input:focus,
.rg-select:focus,
.rg-textarea:focus {
  outline: none;
  border-color: var(--rg-green);
  box-shadow: 0 0 0 3px rgba(74, 124, 78, 0.12);
}
.rg-input::placeholder,
.rg-textarea::placeholder {
  color: var(--rg-ink-faint);
}

/* ---------- Cards / panels ---------- */
.rg-card {
  background: #fff;
  border: 1px solid var(--rg-line);
  border-radius: var(--rg-radius-lg);
  box-shadow: var(--rg-shadow-sm);
  overflow: hidden;
}
.rg-card__header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--rg-line);
  display: flex;
  align-items: center;
  gap: 12px;
}
.rg-card__title {
  font-family: var(--rg-font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--rg-green-dk);
  margin: 0;
}
.rg-card__body { padding: 16px 18px; }

/* ---------- KPI tile ---------- */
.rg-kpi {
  background: #fff;
  border: 1px solid var(--rg-line);
  border-radius: var(--rg-radius);
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  box-shadow: var(--rg-shadow-sm);
}
.rg-kpi__label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--rg-ink-dim);
  font-weight: 600;
}
.rg-kpi__value {
  font-family: var(--rg-font-display);
  font-size: 28px;
  font-weight: 600;
  color: var(--rg-green-dk);
  line-height: 1;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}
.rg-kpi__delta {
  font-size: 11px;
  color: var(--rg-ink-faint);
}

/* ---------- Footer / utility ---------- */
.rg-footer {
  margin-top: auto;
  padding: 10px 28px;
  background: rgba(255, 255, 255, 0.5);
  border-top: 1px solid var(--rg-line);
  font-size: 11px;
  color: var(--rg-ink-faint);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  display: flex;
  justify-content: space-between;
}

/* ---------- Tag / pill ---------- */
.rg-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  border-radius: 999px;
  background: var(--rg-green-pale);
  color: var(--rg-green-dk);
  border: 1px solid var(--rg-line);
}
.rg-pill--tan {
  background: rgba(216, 199, 154, 0.3);
  color: var(--rg-tan-dk);
  border-color: rgba(184, 165, 116, 0.4);
}
.rg-pill--warn {
  background: rgba(184, 116, 45, 0.1);
  color: var(--rg-warning);
  border-color: rgba(184, 116, 45, 0.25);
}

/* ---------- Empty state ---------- */
.rg-empty {
  border: 2px dashed var(--rg-line-strong);
  border-radius: var(--rg-radius-lg);
  padding: 40px 32px;
  text-align: center;
  background: rgba(255, 255, 255, 0.5);
  color: var(--rg-ink-dim);
}
.rg-empty h3 {
  margin: 0 0 6px;
  font-family: var(--rg-font-display);
  font-size: 18px;
  font-weight: 600;
  color: var(--rg-green-dk);
}
.rg-empty p { margin: 0 0 16px; font-size: 13px; }
.rg-empty.is-active {
  border-color: var(--rg-green);
  background: var(--rg-green-pale);
}

/* ---------- Helpers ---------- */
.rg-hidden { display: none !important; }
.rg-row { display: flex; gap: 12px; align-items: center; }
.rg-row--end { justify-content: flex-end; }
.rg-row--between { justify-content: space-between; }
.rg-stack { display: flex; flex-direction: column; gap: 12px; }

/* ---------- Scrollbar (subtle) ---------- */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--rg-line-strong);
  border-radius: 999px;
  border: 2px solid var(--rg-cream);
}
::-webkit-scrollbar-thumb:hover { background: var(--rg-green); }

/* ============================================================
   "Live · running locally" pill — sits in the .rg-header band
   alongside .rg-tag-pill. Reinforces "this is real software"
   on every demo without needing to be said.
   ============================================================ */
.rg-live-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px 3px 8px;
  border-radius: 999px;
  background: rgba(74, 124, 78, 0.12);
  border: 1px solid rgba(74, 124, 78, 0.32);
  font-family: var(--rg-font-mono);
  font-size: 9.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--rg-cream);
  font-weight: 600;
  user-select: none;
}
.rg-live-pill::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #6fcf73;
  box-shadow: 0 0 8px rgba(111, 207, 115, 0.7);
  animation: rg-live-pulse 1.6s ease-in-out infinite;
}
@keyframes rg-live-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.5; transform: scale(0.85); }
}
/* Dark-on-light variant — for tools whose header sits on a cream/light
   background (e.g., Invoice's form-head). Uses dark green text + a
   darker border so it pops against light surfaces. */
.rg-live-pill--dark {
  background: rgba(74, 124, 78, 0.10);
  border-color: rgba(45, 74, 48, 0.45);
  color: var(--rg-green-dk);
}
.rg-live-pill--dark::before {
  background: var(--rg-success, #4a7c4e);
  box-shadow: 0 0 6px rgba(74, 124, 78, 0.55);
}

/* ============================================================
   Demo button — italic-lowercase ghost link.
   Use for stage-only "demo: do a thing" buttons. Same voice as
   the dashboard's `demo: another week` pattern.
   ============================================================ */
.rg-btn--demo {
  background: none;
  border: 0;
  padding: 4px 8px;
  font-family: var(--rg-font-body);
  font-size: 11.5px;
  font-style: italic;
  color: var(--rg-ink-faint);
  text-decoration: underline dotted;
  text-underline-offset: 2px;
  cursor: pointer;
  letter-spacing: 0.02em;
  border-radius: 4px;
  transition: color 140ms ease, background 140ms ease;
}
.rg-btn--demo:hover {
  color: var(--rg-green-dk);
  background: rgba(74, 124, 78, 0.06);
}
.rg-btn--demo:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  color: var(--rg-ink-faint);
  background: none;
  text-decoration: line-through dotted;
}

/* ============================================================
   Toast — floating notification top-right of the tool viewport.
   Same animation/positioning as dashboard's .add-toast.
   ============================================================ */
.rg-toast {
  position: fixed;
  top: 84px;
  right: 24px;
  background: #fff;
  border: 1px solid var(--rg-line);
  border-left: 3px solid var(--rg-success, #4a7c4e);
  border-radius: 6px;
  padding: 9px 14px 9px 12px;
  font-size: 13px;
  font-weight: 500;
  color: var(--rg-ink);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity 220ms ease, transform 220ms ease;
  z-index: 50;
  pointer-events: none;
  max-width: 320px;
}
.rg-toast.is-shown { opacity: 1; transform: translateY(0); }
.rg-toast--warn { border-left-color: var(--rg-warning, #b8742d); }
.rg-toast--info { border-left-color: var(--rg-ink-faint, #8a9b8c); }
.rg-toast b { color: var(--rg-green-dk); font-weight: 700; }
.rg-toast--warn b { color: var(--rg-warning, #b8742d); }
.rg-toast .tdim { color: var(--rg-ink-dim); font-weight: 400; margin-left: 4px; }

/* ============================================================
   CTA pulse — soft expanding green halo, used to highlight the
   "do this next" button after a demo step pre-fills a form. Add
   `.is-pulsing` to any button (modal Save, form Submit, etc.).
   ============================================================ */
@keyframes rg-cta-pulse {
  0%, 100% { box-shadow: 0 0 0 0    rgba(74, 124, 78, 0.65); }
  50%      { box-shadow: 0 0 0 10px rgba(74, 124, 78, 0.0);  }
}
.is-pulsing {
  animation: rg-cta-pulse 1.4s ease-out infinite;
  position: relative;
  z-index: 5;
}

</style>
<style>
  /* ============================================================
     CRM — tool-local styles
     ============================================================ */
  html, body { height: 100%; }
  body { overflow: hidden; }

  .rg-shell {
    height: 100vh;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* ---------- Header tweaks ---------- */
  .rg-header { padding: 10px 20px; }
  .rg-mark { font-size: 18px; }
  .rg-tagline { font-size: 10px; }

  /* ---------- Title strip + KPIs ---------- */
  .rg-title-strip {
    padding: 12px 20px;
    gap: 14px;
  }
  .rg-title-strip h1 { font-size: 18px; }
  .rg-title-strip .rg-sub { font-size: 12px; }
  .rg-title-strip .strip-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .kpi-row {
    display: flex;
    gap: 10px;
  }
  .rg-kpi {
    padding: 8px 14px;
    min-width: 110px;
  }
  .rg-kpi__label { font-size: 9px; letter-spacing: 0.12em; }
  .rg-kpi__value { font-size: 20px; }
  .rg-kpi--warn .rg-kpi__value { color: var(--rg-warning); }
  /* KPI tiles double as filter buttons that swap the left list view. */
  .rg-kpi--btn {
    background: var(--rg-cream);
    border: 1px solid var(--rg-line);
    border-radius: var(--rg-radius);
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;
    transition: border-color 140ms ease, background 140ms ease, transform 140ms ease, box-shadow 140ms ease;
    position: relative;
  }
  .rg-kpi--btn:hover {
    border-color: var(--rg-green);
    background: #fff;
  }
  .rg-kpi--btn:focus-visible {
    outline: 2px solid var(--rg-green);
    outline-offset: 2px;
  }
  .rg-kpi--btn.is-active {
    border-color: var(--rg-green-dk);
    background: #fff;
    box-shadow: 0 0 0 1px var(--rg-green-dk) inset, 0 4px 14px rgba(45, 74, 48, 0.10);
  }
  .rg-kpi--btn.is-active::after {
    content: "";
    position: absolute;
    left: 14px; right: 14px; bottom: -1px;
    height: 2px;
    background: var(--rg-green-dk);
    border-radius: 2px 2px 0 0;
  }
  .rg-kpi--btn.rg-kpi--warn.is-active {
    border-color: var(--rg-warning);
    box-shadow: 0 0 0 1px var(--rg-warning) inset, 0 4px 14px rgba(184, 116, 45, 0.12);
  }
  .rg-kpi--btn.rg-kpi--warn.is-active::after { background: var(--rg-warning); }

  /* List view variants */
  .call-card {
    display: flex; gap: 12px; padding: 10px 14px;
    border-bottom: 1px solid var(--rg-line);
    cursor: pointer;
    transition: background 120ms ease;
  }
  .call-card:hover { background: rgba(74, 124, 78, 0.05); }
  .call-card__time {
    font-family: var(--rg-font-mono);
    font-size: 10px;
    color: var(--rg-ink-faint);
    white-space: nowrap;
    flex-shrink: 0;
    width: 76px;
    line-height: 1.4;
    padding-top: 2px;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .call-card__time .t-time { color: var(--rg-ink-dim); }
  .call-card__body { flex: 1; min-width: 0; }
  .call-card__name {
    font-weight: 600;
    color: var(--rg-green-dk);
    font-size: 13px;
    margin-bottom: 2px;
  }
  .call-card__note {
    font-size: 12px;
    color: var(--rg-ink-dim);
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .overdue-card {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    border-bottom: 1px solid var(--rg-line);
    cursor: pointer;
    transition: background 120ms ease;
  }
  .overdue-card--overdue:hover { background: rgba(184, 116, 45, 0.06); }
  .overdue-card--upcoming:hover { background: rgba(74, 124, 78, 0.05); }
  .overdue-card.is-selected.overdue-card--overdue {
    background: rgba(184, 116, 45, 0.10);
    border-left: 3px solid var(--rg-warning);
    padding-left: 11px;
  }
  .overdue-card.is-selected.overdue-card--upcoming {
    background: rgba(74, 124, 78, 0.08);
    border-left: 3px solid var(--rg-green);
    padding-left: 11px;
  }
  .overdue-card__body { flex: 1; min-width: 0; }
  .overdue-card__name { font-weight: 600; color: var(--rg-green-dk); font-size: 13px; }
  .overdue-card__date {
    font-family: var(--rg-font-mono);
    font-size: 11px;
    margin-top: 2px;
    font-weight: 600;
  }
  .overdue-card--overdue .overdue-card__date { color: var(--rg-warning); }
  .overdue-card--upcoming .overdue-card__date { color: var(--rg-green-dk); }
  .overdue-card__note {
    font-size: 11.5px;
    color: var(--rg-ink-dim);
    margin-top: 3px;
    line-height: 1.35;
  }
  .overdue-section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 10px 14px 6px;
    font-size: 9.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--rg-ink-faint);
    font-weight: 700;
    background: var(--rg-cream-dk);
    border-bottom: 1px solid var(--rg-line);
  }
  .overdue-section-head .count {
    font-family: var(--rg-font-mono);
    font-size: 10px;
    color: var(--rg-ink-dim);
    letter-spacing: 0.05em;
  }

  /* ---------- Main two-pane region ---------- */
  .crm-main {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 35% 65%;
    min-height: 0;
    overflow: hidden;
  }

  /* ---------- Left pane: contacts list ---------- */
  .pane-left {
    border-right: 1px solid var(--rg-line);
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: rgba(255,255,255,0.5);

<script>
/* ============================================================

(() => {

  // Stage-reset hook: if the deck's "Stage reset" button reloaded us with

  // ---------- Seed data ------------------------------------------------

          followup: { date: "2026-08-01", note: "Possible relocation Q3 — confirm" },

        }
      ],
      selectedId: "c-pemberton"
    };
  }

  // ---------- State + persistence -------------------------------------
  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return seedData();
      const parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.contacts)) return seedData();
      return parsed;
    } catch (e) {
      return seedData();
    }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { /* quota ignored */ }
  }

  // ---------- Helpers --------------------------------------------------
  const $  = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  function todayISO() {
    const d = new Date();
    return d.toISOString().slice(0, 10);
  }
  function parseISODate(iso) {
    if (!iso) return null;
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function fmtDateShort(iso) {
    if (!iso) return "";
    const dt = parseISODate(iso);
    if (!dt || isNaN(dt)) return iso;
    return dt.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }
  function fmtCallTime(iso) {
    const dt = new Date(iso);
    if (isNaN(dt)) return iso;
    const date = dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    const time = dt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    return `${date} · ${time}`;
  }
  function fmtMoney(n) {
    if (typeof n !== "number") return "—";
    return n.toLocaleString(undefined, { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  }
  function initials(name) {
    if (!name) return "?";
    const parts = name.trim().split(/\s+/).filter(Boolean);
    const cleaned = parts.filter(p => !/^(the|a|an)$/i.test(p));
    const use = cleaned.length ? cleaned : parts;
    if (use.length === 1) return use[0].slice(0, 2).toUpperCase();
    return (use[0][0] + use[use.length - 1][0]).toUpperCase();
  }
  function isOverdue(followup) {
    if (!followup || !followup.date) return false;
    const d = parseISODate(followup.date);
    const today = parseISODate(todayISO());
    return d < today;
  }
  function uid(prefix = "id") {
    return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}`;
  }
  function escapeHtml(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function lastActivityISO(c) {
    let candidates = [];
    if (c.last_service) candidates.push(c.last_service);
    if (c.calls && c.calls.length) {
      candidates.push(c.calls[0].at.slice(0, 10));
    }
    if (!candidates.length) return "0000-00-00";
    candidates.sort();
    return candidates[candidates.length - 1];
  }

  // ---------- KPI render ----------------------------------------------
  function renderKPIs() {
    const total = state.contacts.length;
    const today = parseISODate(todayISO());
    const weekAgo = new Date(today);
    weekAgo.setDate(weekAgo.getDate() - 7);

    let calls = 0;
    let overdue = 0;
    state.contacts.forEach(c => {
      (c.calls || []).forEach(call => {
        const dt = new Date(call.at);
        if (!isNaN(dt) && dt >= weekAgo && dt <= new Date(today.getTime() + 86400000)) calls++;
      });
      if (isOverdue(c.followup)) overdue++;
    });

    $("#kpi-total").textContent = total;
    $("#kpi-calls").textContent = calls;
    $("#kpi-overdue").textContent = overdue;
  }

  // ---------- List views ---------------------------------------------
  // The KPI tiles in the title strip double as filter buttons. The
  // currently-active view determines what the left pane displays:
  //   customers — every contact, sorted by last activity (default)
  //   calls    — every logged call across contacts, newest first
  //   overdue  — every contact whose follow-up date is in the past
  let currentView = "customers";

  function renderList() {
    const list = $("#contact-list");
    if (currentView === "calls")    return renderCallsList(list);
    if (currentView === "overdue")  return renderOverdueList(list);
    return renderCustomersList(list);
  }

  function renderCustomersList(list) {
    const q = ($("#search").value || "").trim().toLowerCase();

    const filtered = state.contacts
      .slice()
      .filter(c => {
        if (!q) return true;
        return (
          (c.name || "").toLowerCase().includes(q) ||
          (c.email || "").toLowerCase().includes(q) ||
          (c.phone || "").toLowerCase().includes(q)
        );
      })
      .sort((a, b) => lastActivityISO(b).localeCompare(lastActivityISO(a)));

    if (!filtered.length) {
      list.innerHTML = `<div class="empty-list">No customers match “${escapeHtml(q)}”.</div>`;
      return;
    }

    list.innerHTML = filtered.map(c => {
      const sel = c.id === state.selectedId ? " is-selected" : "";
      const overdue = isOverdue(c.followup);
      const dot = overdue ? `<span class="overdue-dot" title="Overdue follow-up"></span>` : "";
      const lastSvc = c.last_service ? fmtDateShort(c.last_service) : "—";
      const svc = c.service_type ? `<span class="rg-pill">${escapeHtml(c.service_type)}</span>` : "";
      return `
        <div class="contact-card${sel}" data-id="${c.id}">
          <div class="avatar">${escapeHtml(initials(c.name))}</div>
          <div class="contact-card__body">
            <div class="contact-card__name">${escapeHtml(c.name)}</div>
            <div class="contact-card__meta">
              <span>${lastSvc}</span>
              ${svc}
            </div>
          </div>
          ${dot}
        </div>
      `;
    }).join("");

    $$(".contact-card", list).forEach(el => {
      el.addEventListener("click", () => {
        state.selectedId = el.getAttribute("data-id");
        save();
        renderList();
        renderDetail();
      });
    });
  }

  function renderCallsList(list) {
    const q = ($("#search").value || "").trim().toLowerCase();
    // Flatten calls across all contacts, attach the contact name + id
    const allCalls = [];
    state.contacts.forEach(c => {
      (c.calls || []).forEach(call => {
        allCalls.push({ ...call, contactId: c.id, contactName: c.name });
      });
    });
    const filtered = allCalls
      .filter(call => {
        if (!q) return true;
        return (
          (call.contactName || "").toLowerCase().includes(q) ||
          (call.note || "").toLowerCase().includes(q)
        );
      })
      .sort((a, b) => (b.at || "").localeCompare(a.at || ""));

    if (!filtered.length) {
      list.innerHTML = `<div class="empty-list">${q
        ? `No calls match “${escapeHtml(q)}”.`
        : `No calls logged yet · open a customer and click "Log a call" to start.`}</div>`;
      return;
    }

    list.innerHTML = filtered.map(call => {
      const dt = new Date(call.at);
      const dateStr = isNaN(dt) ? "—" : dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      const timeStr = isNaN(dt) ? "" : dt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      return `
      <div class="call-card" data-contact-id="${call.contactId}">
        <div class="call-card__time">
          <span class="t-date">${escapeHtml(dateStr)}</span>
          <span class="t-time">${escapeHtml(timeStr)}</span>
        </div>
        <div class="call-card__body">
          <div class="call-card__name">${escapeHtml(call.contactName)}</div>
          <div class="call-card__note">${escapeHtml(call.note || "")}</div>
        </div>
      </div>
    `;}).join("");

    $$(".call-card", list).forEach(el => {
      el.addEventListener("click", () => {
        state.selectedId = el.getAttribute("data-contact-id");
        save();
        // Switch back to customers view so the selection is visible in the list
        setView("customers");
      });
    });
  }

  function renderOverdueList(list) {
    const q = ($("#search").value || "").trim().toLowerCase();
    // Both overdue AND upcoming follow-ups: overdue first (warn-styled), then
    // upcoming sorted by soonest date. The KPI count still tracks overdue, but
    // the list shows everything you might need to act on.
    const withFu = state.contacts
      .filter(c => c.followup && c.followup.date)
      .filter(c => !q || (c.name || "").toLowerCase().includes(q));
    const overdue = withFu
      .filter(c => isOverdue(c.followup))
      .sort((a, b) => (a.followup.date || "").localeCompare(b.followup.date || ""));
    const upcoming = withFu
      .filter(c => !isOverdue(c.followup))
      .sort((a, b) => (a.followup.date || "").localeCompare(b.followup.date || ""));

    if (!overdue.length && !upcoming.length) {
      list.innerHTML = `<div class="empty-list">${q
        ? `No follow-ups match “${escapeHtml(q)}”.`
        : `No follow-ups set · pick a customer to schedule one.`}</div>`;
      return;
    }

    const renderCard = (c, kind) => {
      const sel = c.id === state.selectedId ? " is-selected" : "";
      const klass = kind === "overdue" ? " overdue-card--overdue" : " overdue-card--upcoming";
      const label = kind === "overdue" ? "Due" : "Upcoming";
      return `
        <div class="overdue-card${sel}${klass}" data-id="${c.id}">
          <div class="avatar">${escapeHtml(initials(c.name))}</div>
          <div class="overdue-card__body">
            <div class="overdue-card__name">${escapeHtml(c.name)}</div>
            <div class="overdue-card__date">${label} ${fmtDateShort(c.followup.date)}</div>
            ${c.followup.note ? `<div class="overdue-card__note">${escapeHtml(c.followup.note)}</div>` : ""}
          </div>
        </div>
      `;
    };

    const sectionHead = (label, count) => `
      <div class="overdue-section-head">
        <span>${label}</span><span class="count">${count}</span>
      </div>`;

    let html = "";
    if (overdue.length) {
      html += sectionHead("Overdue", overdue.length);
      html += overdue.map(c => renderCard(c, "overdue")).join("");
    }
    if (upcoming.length) {
      html += sectionHead("Upcoming", upcoming.length);
      html += upcoming.map(c => renderCard(c, "upcoming")).join("");
    }
    list.innerHTML = html;

    $$(".overdue-card", list).forEach(el => {
      el.addEventListener("click", () => {
        state.selectedId = el.getAttribute("data-id");
        save();
        renderList();
        renderDetail();
      });
    });
  }

  function setView(view) {
    if (view !== "customers" && view !== "calls" && view !== "overdue") return;
    currentView = view;
    $$(".rg-kpi--btn").forEach(btn => {
      const active = btn.getAttribute("data-view") === view;
      btn.classList.toggle("is-active", active);
      btn.setAttribute("aria-pressed", active ? "true" : "false");
    });
    // Update placeholder to hint at what search filters in this view
    const search = $("#search");
    if (search) {
      search.placeholder =
        view === "calls"   ? "Search calls…" :
        view === "overdue" ? "Search follow-ups…" :
                             "Search customers…";
    }
    renderList();
  }

  // ---------- Detail render -------------------------------------------
  function getSelected() {
    return state.contacts.find(c => c.id === state.selectedId) || null;
  }

    const c = getSelected();
    const empty = $("#detail-empty");
    const detail = $("#detail");
    if (!c) {
      empty.style.display = "";
      detail.style.display = "none";
      return;
    }
    empty.style.display = "none";
    detail.style.display = "";

    const fu = c.followup;
    const fuOverdue = isOverdue(fu);
    let fuBlock = "";
    if (fu && fu.date) {
      const pillClass = fuOverdue ? "rg-pill--warn" : "rg-pill--tan";
      const label = fuOverdue ? "Overdue" : "Upcoming";
      fuBlock = `
        <div class="followup-display">

    } else {

      const sorted = c.calls.slice().sort((a, b) => b.at.localeCompare(a.at));
      callsBlock = `<div class="call-list">${sorted.map(cl => `
        <div class="call-entry" data-call-id="${cl.id}">
          <div class="call-entry__time">${escapeHtml(fmtCallTime(cl.at))}</div>
          <div class="call-entry__note">${escapeHtml(cl.note)}</div>
          <button class="call-entry__del" data-action="call-del" data-call-id="${cl.id}" title="Delete">×</button>
        </div>
      `).join("")}</div>`;
    } else {
      callsBlock = `<div class="empty-soft">No calls yet · click "Log a call" to start.</div>`;
    }

    detail.innerHTML = `
      <div class="detail-head">
        <div class="avatar avatar--lg">${escapeHtml(initials(c.name))}</div>
        <div class="detail-head__body">
          <h2 class="detail-head__name">${escapeHtml(c.name)}</h2>
          <div class="detail-head__sub">
            Lifetime value <span class="ltv">${fmtMoney(c.lifetime_value)}</span>
            ${c.service_type ? ` · ${escapeHtml(c.service_type)}` : ""}
          </div>
        </div>
        <button class="rg-btn rg-btn--secondary rg-btn--sm" data-action="edit">Edit</button>
      </div>

      <div class="detail-grid">
        <div><span class="lbl">Email</span><span class="val">${escapeHtml(c.email || "—")}</span></div>
        <div><span class="lbl">Phone</span><span class="val">${escapeHtml(c.phone || "—")}</span></div>
        <div><span class="lbl">Address</span><span class="val">${escapeHtml(c.address || "—")}</span></div>
        <div><span class="lbl">Service type</span><span class="val">${escapeHtml(c.service_type || "—")}</span></div>
        <div><span class="lbl">Last service</span><span class="val">${c.last_service ? fmtDateShort(c.last_service) : "—"}</span></div>
        <div><span class="lbl">Lifetime value</span><span class="val">${fmtMoney(c.lifetime_value)}</span></div>
      </div>

      <div class="section">
        <div class="section__head">
          <h3 class="section__title">Notes</h3>
          <span class="spacer"></span>
          <span class="saved-pill" id="saved-pill">Saved ✓</span>
        </div>
        <textarea class="rg-textarea notes-textarea" id="notes-ta" placeholder="Anything worth remembering about this customer…">${escapeHtml(c.notes || "")}</textarea>
      </div>

      <div class="section">
        <div class="section__head">
          <h3 class="section__title">Follow-up</h3>
        </div>
        <div class="followup-row">
          <input type="date" class="rg-input" id="fu-date" value="${fu && fu.date ? fu.date : ""}" />
          <input type="text" class="rg-input" id="fu-note" placeholder="What's the follow-up about? (optional)" value="${escapeHtml(fu && fu.note ? fu.note : "")}" style="flex: 1 1 200px; padding: 7px 10px; font-size: 12.5px;" />
          <button class="rg-btn rg-btn--primary rg-btn--sm" data-action="fu-save">Set follow-up</button>
        </div>
        <div class="preset-row">
          <button class="rg-btn rg-btn--secondary" data-preset="7">+1 week</button>
          <button class="rg-btn rg-btn--secondary" data-preset="14">+2 weeks</button>
          <button class="rg-btn rg-btn--secondary" data-preset="30">+1 month</button>
        </div>
        ${fuBlock}
      </div>

      <div class="section">
        <div class="section__head">
          <h3 class="section__title">Call log</h3>
          <span class="spacer"></span>
          <button class="rg-btn rg-btn--secondary rg-btn--sm" data-action="call-open">Log a call</button>
        </div>
        <div id="call-form-slot"></div>
        ${callsBlock}
      </div>
    `;

    wireDetailEvents();
  }

  // ---------- Detail event wiring -------------------------------------
  function wireDetailEvents() {
    const detail = $("#detail");
    const c = getSelected();
    if (!c) return;

    // Notes autosave on blur
    const ta = $("#notes-ta", detail);
    ta.addEventListener("blur", () => {
      if (ta.value !== (c.notes || "")) {
        c.notes = ta.value;
        save();
        flashSaved();
      }
    });

    // Follow-up presets
    $$("[data-preset]", detail).forEach(btn => {
      btn.addEventListener("click", () => {
        const days = parseInt(btn.getAttribute("data-preset"), 10);
        const d = new Date();
        d.setDate(d.getDate() + days);
        const iso = d.toISOString().slice(0, 10);
        $("#fu-date", detail).value = iso;
      });
    });

    // Action delegation — wire ONCE on the stable #detail element. Re-attaching
    // this on every render would stack listeners with stale `c` closures, which
    // caused follow-ups (and call deletions / edits) to land on the wrong contact
    // after switching customers. The handler reads the current selection fresh
    // each click.
    if (!detail._clickWired) {
      detail._clickWired = true;
      detail.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        const action = btn.getAttribute("data-action");
        const c = getSelected();
        if (!c) return;

      if (action === "fu-save") {
        const date = $("#fu-date", detail).value;
        const note = $("#fu-note", detail).value.trim();
        if (!date) { $("#fu-date", detail).focus(); return; }
        c.followup = { date, note };
        save();
        renderKPIs();
        renderList();
        renderDetail();
      }
      else if (action === "fu-clear") {
        c.followup = null;
        save();
        renderKPIs();
        renderList();
        renderDetail();
      }
      else if (action === "call-open") {
        openCallForm();
      }
      else if (action === "call-del") {
        const cid = btn.getAttribute("data-call-id");
        c.calls = (c.calls || []).filter(x => x.id !== cid);
        save();
        renderKPIs();
        renderDetail();
      }
      else if (action === "edit") {
        // lightweight inline edit: prompt for the basics. Keeps the tool light.
        const newName = prompt("Customer name:", c.name);
        if (newName == null) return;
        const newEmail = prompt("Email:", c.email || "");
        const newPhone = prompt("Phone:", c.phone || "");
        const newAddr  = prompt("Address:", c.address || "");
        const newSvc   = prompt("Service type:", c.service_type || "");
        c.name = newName.trim() || c.name;
        c.email = newEmail || "";
        c.phone = newPhone || "";
        c.address = newAddr || "";
        c.service_type = newSvc || "";
        save();
        renderList();
        renderDetail();
      }
      });
    }
  }

  function openCallForm() {
    const slot = $("#call-form-slot");
    if (!slot || slot.querySelector(".call-form")) return;
    slot.innerHTML = `
      <div class="call-form">
        <textarea class="rg-textarea" id="call-note" placeholder="What did you discuss? One line is plenty."></textarea>
        <div class="call-form-actions">
          <button class="rg-btn rg-btn--ghost rg-btn--sm" id="call-cancel">Cancel</button>
          <button class="rg-btn rg-btn--primary rg-btn--sm" id="call-save">Save</button>
        </div>
      </div>
    `;
    const ta = $("#call-note");
    ta.focus();
    $("#call-cancel").addEventListener("click", () => { slot.innerHTML = ""; });
    $("#call-save").addEventListener("click", () => {
      const note = ta.value.trim();
      if (!note) { ta.focus(); return; }
      const c = getSelected();
      if (!c) return;
      c.calls = c.calls || [];
      c.calls.unshift({
        id: uid("ca"),
        at: new Date().toISOString(),
        note
      });
      save();
      renderKPIs();
      renderDetail();
    });
  }

  // ---------- Saved-pill flash ----------------------------------------
  let savedTimer = null;
  function flashSaved() {
    const pill = $("#saved-pill");
    if (!pill) return;
    pill.classList.add("is-visible");
    clearTimeout(savedTimer);
    savedTimer = setTimeout(() => pill.classList.remove("is-visible"), 1400);
  }

  // ---------- Add-customer modal --------------------------------------
  const modal = $("#modal-backdrop");
  const addForm = $("#add-form");

  function openAdd() {
    addForm.reset();
    modal.classList.add("is-open");
    setTimeout(() => addForm.elements["name"].focus(), 30);
  }
  function closeAdd() { modal.classList.remove("is-open"); }

  // If the user dismisses the modal mid-demo, restore the demo button so
  // they can retry step 1 instead of being stuck in "click Save above".
  function handleAddModalDismiss(){
    if (typeof demoAddPending === 'undefined' || !demoAddPending) return;
    demoAddPending = false;
    const saveBtn = document.getElementById('btn-add-save');
    if (saveBtn) saveBtn.classList.remove('is-pulsing');
    const dbtn = document.getElementById('btn-demo-linda');
    if (dbtn) {
      dbtn.disabled = false;
      dbtn.textContent = "demo: walk through Linda's intake";
    }
    // Roll back the step counter so step 1 can re-run
    demoLindaStep = 0;
  }

  $("#btn-add").addEventListener("click", openAdd);
  $("#btn-add-cancel").addEventListener("click", () => { closeAdd(); handleAddModalDismiss(); });
  modal.addEventListener("click", (e) => {
    if (e.target === modal) { closeAdd(); handleAddModalDismiss(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.classList.contains("is-open")) { closeAdd(); handleAddModalDismiss(); }
  });

  addForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const fd = new FormData(addForm);
    const name = (fd.get("name") || "").toString().trim();
    if (!name) return;
    // For the demo flow, also seed Linda's pre-loaded note so step 2 (log call)
    // and step 3 (set follow-up) read like a real intake. Otherwise (manual
    // add by the user) leave notes/follow-up empty, the existing behavior.
    const isDemoSubmit = typeof demoAddPending !== 'undefined' && demoAddPending;
    const newC = {
      id: uid("c"),
      name,
      email: (fd.get("email") || "").toString().trim(),
      phone: (fd.get("phone") || "").toString().trim(),
      address: (fd.get("address") || "").toString().trim(),
      service_type: (fd.get("service_type") || "").toString().trim(),
      last_service: null,
      lifetime_value: 0,
      notes: isDemoSubmit ? LINDA_PROFILE.notes : "",
      followup: null,
      calls: []
    };
    state.contacts.unshift(newC);
    state.selectedId = newC.id;
    save();
    closeAdd();
    renderKPIs();
    renderList();
    renderDetail();

    // If this submission came from the demo flow, capture Linda's id and
    // advance the demo to step 2 (log a call).
    if (isDemoSubmit) {
      demoAddPending = false;
      const saveBtn = document.getElementById('btn-add-save');
      if (saveBtn) saveBtn.classList.remove('is-pulsing');
      demoLindaId = newC.id;
      // demoLindaStep stays at 1 — the next click of the demo button will
      // increment it to 2 and run the "Log a call" branch.
      const dbtn = document.getElementById('btn-demo-linda');
      if (dbtn) {
        dbtn.disabled = false;
        dbtn.textContent = "demo: log a call";
      }
      showToast(`<b>+ Linda Park</b> <span class="tdim">added from inquiry</span>`);
    }
  });

  // ---------- Reset to demo data --------------------------------------
  $("#btn-reset").addEventListener("click", () => {
    if (!confirm("Restore the seeded demo customers? This clears your local changes.")) return;
    localStorage.removeItem(STORAGE_KEY);
    state = seedData();
    save();
    setView("customers");
    renderAll();
    // Reset demo intake counter so the walk-through can re-run cleanly
    demoLindaStep = 0;
    if (typeof demoAddPending !== 'undefined') demoAddPending = false;
    // Close + clear the add modal if it was open mid-demo
    if (modal) modal.classList.remove('is-open');
    const saveBtn = document.getElementById('btn-add-save');
    if (saveBtn) saveBtn.classList.remove('is-pulsing');
    const btn = $("#btn-demo-linda");
    if (btn) {
      btn.disabled = false;
      btn.textContent = "demo: walk through Linda's intake";
    }
  });

  // ---------- Demo: walk through Linda's intake -----------------------
  // Single button, 4-step state machine. Each click advances by one step.
  // Click 1: add Linda + select her + populate note
  // Click 2: log a call (current timestamp)
  // Click 3: set follow-up one week out
  // Click 4+: toast "intake complete"
  let demoLindaStep = 0;
  let demoLindaId   = null;
  const LINDA_PROFILE = {
    name:         "Linda Park",
    email:        "linda.park@example.com",
    phone:        "(801) 555-0142",
    address:      "412 Birch Lane, Provo UT 84601",
    service_type: "Lawn care · weekly",
    last_service: null,
    lifetime_value: 0,
    notes:        "Inquiry came in 5/05 — wants weekly lawn + backyard hardscape consult. New homeowner.",
    followup:     null,
    calls:        []
  };
  function showToast(html, kind) {
    const t = $("#rg-toast");
    if (!t) return;
    t.className = `rg-toast rg-toast--${kind || "success"}`;
    t.innerHTML = html;
    t.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add("is-shown")));
    clearTimeout(t._timer);
    t._timer = setTimeout(() => {
      t.classList.remove("is-shown");
      setTimeout(() => { t.hidden = true; }, 240);
    }, 4000);
  }
  // True while step 1 has opened the + Add customer modal and is waiting
  // for the user to click "Save customer" to commit.
  let demoAddPending = false;

  $("#btn-demo-linda").addEventListener("click", () => {
    demoLindaStep++;
    if (demoLindaStep === 1) {
      // Step 1 — open the + Add customer modal pre-filled with Linda's data
      // and pulse "Save customer" so the audience sees the actual workflow.
      // The demo doesn't advance until the user clicks Save customer.
      const dbtn = document.getElementById('btn-demo-linda');
      addForm.reset();
      addForm.elements['name'].value         = LINDA_PROFILE.name;
      addForm.elements['email'].value        = LINDA_PROFILE.email;
      addForm.elements['phone'].value        = LINDA_PROFILE.phone;
      addForm.elements['address'].value      = LINDA_PROFILE.address;
      addForm.elements['service_type'].value = LINDA_PROFILE.service_type;
      modal.classList.add('is-open');
      const saveBtn = document.getElementById('btn-add-save');
      if (saveBtn) saveBtn.classList.add('is-pulsing');
      demoAddPending = true;
      // Park the demo button while we wait for Save customer
      if (dbtn) {
        dbtn.disabled = true;
        dbtn.textContent = "demo: click Save customer above";
      }
      // Don't toast here — the form-submit handler will toast when Linda lands.
      return;
    } else if (demoLindaStep === 2) {
      // Log a call with the actual current timestamp
      const linda = state.contacts.find(c => c.id === demoLindaId);
      if (!linda) { demoLindaStep = 0; return; }
      linda.calls = linda.calls || [];
      linda.calls.unshift({
        id: uid("ca"),
        at: new Date().toISOString(),
        note: "Initial outreach — walked through her project, confirmed weekly lawn + scheduled the backyard consult."
      });
      state.selectedId = demoLindaId;
      save();
      renderKPIs();
      renderList();
      renderDetail();
      const t = new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      showToast(`<b>Call logged</b> <span class="tdim">${t} · 12 min</span>`);
      const btn = $("#btn-demo-linda");
      if (btn) btn.textContent = "demo: set follow-up";
    } else if (demoLindaStep === 3) {
      // Set follow-up one week out
      const linda = state.contacts.find(c => c.id === demoLindaId);
      if (!linda) { demoLindaStep = 0; return; }
      const d = new Date();
      d.setDate(d.getDate() + 7);
      const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      linda.followup = { date: iso, note: "Walk the backyard together — confirm patio scope" };
      state.selectedId = demoLindaId;
      save();
      renderKPIs();
      renderList();
      renderDetail();
      showToast(`<b>Follow-up set</b> <span class="tdim">+7 days</span>`);
      const btn = $("#btn-demo-linda");
      if (btn) btn.textContent = "demo: see all calls this week";
    } else if (demoLindaStep === 4) {
      // Step 4 — flip the left list to "Calls This Week" view so the audience
      // sees Linda's just-logged call sitting at the top of every recent call
      // across every contact. Showcases the KPI-as-pivot feature that the
      // rest of the demo never touches.
      setView("calls");
      showToast(`<b>Calls this week</b> <span class="tdim">Linda's just-logged call sits on top</span>`, 'info');
      const btn = $("#btn-demo-linda");
      if (btn) {
        btn.textContent = "demo: intake complete";
        btn.disabled = true;
      }
    } else {
      const btn = $("#btn-demo-linda");
      btn.disabled = true;
      btn.textContent = "demo: intake complete";
      showToast(`<b>Linda's intake complete</b> <span class="tdim">click Reset to re-run</span>`, "info");
    }
  });

  // ---------- Search --------------------------------------------------
  $("#search").addEventListener("input", () => renderList());

  // KPI tiles act as filter buttons that swap the left list view.
  $$(".rg-kpi--btn").forEach(btn => {
    btn.addEventListener("click", () => setView(btn.getAttribute("data-view")));
  });

  // ---------- Initial render ------------------------------------------
  function renderAll() {
    renderKPIs();
    renderList();
    renderDetail();
  }
  // Make sure first-load seed is persisted so reload behavior is consistent.
  if (!localStorage.getItem(STORAGE_KEY)) save();
  renderAll();

})();
</script>
</body>
</html>
